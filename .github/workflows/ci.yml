# Tier 4-3: 最低限のCI。push/PR毎に `next build` を回して、壊れたままのデプロイを防ぐ。
# （これまで手動で叩いていた `npm run build` の自動化）
name: CI (build)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # ── ガード: SSRページに長い stale-while-revalidate を入れさせない ──
      # 2026年7月上旬、SWR=1日にしたことでCDNが古いHTMLを配信し続け、
      # そのHTMLが指す旧ビルドIDのJSが404 → 個別ページが6日間真っ黒になった。
      # Googlebotも同じHTMLを踏み、インデックスが230→53に崩落（表示-92%の真因）。
      # HTMLとJSはビルドID一致が必須なので、HTMLを長時間staleにしてはいけない。
      # 許容は300秒(5分)まで。現行は全て stale-while-revalidate=120。
      - name: Guard - no long stale-while-revalidate in pages/
        run: |
          set -uo pipefail
          # pages/配下から stale-while-revalidate=<数値> を全部抜き出し、300超を探す
          BAD=$(grep -rnoE 'stale-while-revalidate=[0-9]+' pages/ 2>/dev/null \
                | awk -F'stale-while-revalidate=' '$2+0 > 300 {print}')
          if [ -n "$BAD" ]; then
            echo "::error::pages/ に stale-while-revalidate が300秒を超える箇所があります。"
            echo "$BAD" | while IFS= read -r line; do echo "::error::  $line"; done
            echo ""
            echo "理由: Next.jsはデプロイ毎にビルドIDが変わり旧JSチャンクは消えます。"
            echo "      CDNが古いHTMLを長時間配信すると、消えた旧JSを指して404になり"
            echo "      Reactが起動せずページが真っ黒になります（2026-07の6日間の事故）。"
            echo "対処: SSRのCache-Controlは 's-maxage=60, stale-while-revalidate=120' 程度にしてください。"
            exit 1
          fi
          echo "✅ pages/ の stale-while-revalidate は全て300秒以下"

      - name: Install deps
        run: npm ci

      # ── ガード一式 ────────────────────────────────────────────────
      # ⚠️ ここに個別のガードを並べないこと。
      #    2026-08-26、ci.yml と scripts/ci/check_release_guards.mjs で
      #    **別々のガードを並べていた**ため、手元の `npm run build` は通るのに
      #    CIだけが落ちた（共通していたのは1本だけだった）。
      #    リリース前ガードの一覧は check_release_guards.mjs が唯一の定義元。
      #    新しいガードはそちらに1行足す。ここは触らない。
      #    ※ npm run build の prebuild でも同じものが走るため二重に見えるが、
      #      「依存を入れる前に落とせる」ことに意味があるのでここでも明示的に実行する。
      - name: Guard - release guards (same set as local prebuild)
        run: node scripts/ci/check_release_guards.mjs

      - name: Next build
        run: npm run build
        env:
          # ビルドは getServerSideProps を実行しない（＝実データ不要）ためダミーでよい。
          # モジュール読込時に process.env を参照する箇所のフォールバック回避用。
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          VITE_PUBLIC_SITE_URL: https://www.mens-esthe-map.jp
